<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Recherche immo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b6e4f">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <style>
/*CSS*/
    #verrou { max-width: 360px; margin: 15vh auto; padding: 24px; text-align: center; }
    #verrou input[type=password] { width: 100%; font-size: 18px; padding: 10px; margin: 12px 0; box-sizing: border-box; }
    #verrou button { font-size: 18px; padding: 10px 24px; }
    #erreur { color: #b00020; min-height: 1.4em; }
  </style>
</head>
<body>
<div id="verrou" class="carte">
  <h1>🏠 Recherche immo</h1>
  <form id="form-mdp">
    <input type="password" id="mdp" placeholder="Mot de passe" autocomplete="current-password" autofocus>
    <label class="case"><input type="checkbox" id="retenir" checked> Se souvenir sur cet appareil</label>
    <p id="erreur"></p>
    <button type="submit">Ouvrir</button>
  </form>
</div>
<div id="app" hidden></div>
<script>
// Données chiffrées (AES-256-GCM, clé dérivée du mot de passe par PBKDF2-SHA256).
const D = "__DONNEES__";
let PAGES = null;

const octets = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function dechiffrer(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: octets(D.sel), iterations: D.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const brut = await crypto.subtle.decrypt({ name: "AES-GCM", iv: octets(D.iv) }, cle, octets(D.ct));
  const flux = new Blob([brut]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(flux).text());
}

function aller(url) { location.hash = url; }

// ---- Filtres et tri de la liste, faits sur l'appareil (mémorisés entre deux visites)
let FILTRES = {}, TRI = { cle: "score", desc: true };
try { FILTRES = JSON.parse(localStorage.getItem("immo_filtres") || "{}"); } catch (e) {}
const nombre = v => (v === "" || v == null || isNaN(+v)) ? null : +v;

function appliquerFiltres() {
  const tb = document.querySelector("#app .tableau tbody");
  if (!tb) return;
  const f = FILTRES, n = k => nombre(f[k]);
  const commune = (f.commune || "").trim().toLowerCase();
  let vus = 0;
  for (const tr of tb.rows) {
    const d = tr.dataset, prix = nombre(d.prix), m2 = nombre(d.surface);
    const ok = (f.tous || d.hors === "0")
      && (n("score_min") == null || +d.score >= n("score_min"))
      && (!commune || d.commune.includes(commune))
      && (!f.type || d.type === f.type)
      && (!f.pays || d.pays === f.pays)
      && (n("prix_min") == null || (prix != null && prix >= n("prix_min")))
      && (n("prix_max") == null || (prix != null && prix <= n("prix_max")))
      && (n("m2_min") == null || (m2 != null && m2 >= n("m2_min")))
      && (n("m2_max") == null || (m2 != null && m2 <= n("m2_max")));
    tr.hidden = !ok;
    if (ok) vus++;
  }
  const c = document.getElementById("compteur-js");
  if (c) c.textContent = vus;
  try { localStorage.setItem("immo_filtres", JSON.stringify(FILTRES)); } catch (e) {}
}

function trier() {
  const tb = document.querySelector("#app .tableau tbody");
  if (!tb) return;
  const cle = TRI.cle, texte = cle === "commune";
  const lignes = [...tb.rows].sort((a, b) => {
    const x = texte ? a.dataset[cle] : nombre(a.dataset[cle]);
    const y = texte ? b.dataset[cle] : nombre(b.dataset[cle]);
    if (x == null || x === "") return 1;       // valeurs inconnues en fin de liste
    if (y == null || y === "") return -1;
    const r = texte ? x.localeCompare(y) : x - y;
    return TRI.desc ? -r : r;
  });
  lignes.forEach(l => tb.appendChild(l));
  document.querySelectorAll("#app [data-tri]").forEach(a => {
    a.classList.toggle("trie", a.dataset.tri === cle);
    a.textContent = a.textContent.replace(/ [▲▼]$/, "") + (a.dataset.tri === cle ? (TRI.desc ? " ▼" : " ▲") : "");
  });
}

function brancherListe() {
  const panneau = document.getElementById("filtres-js");
  if (!panneau) return;
  for (const el of panneau.querySelectorAll("[data-f]")) {
    const k = el.dataset.f;
    if (k === "raz") {
      el.addEventListener("click", () => {
        FILTRES = {}; TRI = { cle: "score", desc: true };
        brancherValeurs(panneau); trier(); appliquerFiltres();
      });
      continue;
    }
    if (k === "tri") {
      el.addEventListener("change", () => {
        const [cle, desc] = el.value.split("|");
        TRI = { cle, desc: desc === "1" }; FILTRES.tri = el.value;
        trier(); appliquerFiltres();
      });
      continue;
    }
    el.addEventListener(el.tagName === "SELECT" || el.type === "checkbox" ? "change" : "input", () => {
      FILTRES[k] = el.type === "checkbox" ? el.checked : el.value;
      appliquerFiltres();
    });
  }
  brancherValeurs(panneau);
  if (FILTRES.tri) { const [cle, desc] = FILTRES.tri.split("|"); TRI = { cle, desc: desc === "1" }; }
  if (Object.entries(FILTRES).some(([k, v]) => v && k !== "tri")) panneau.open = true;
  if (TRI.cle !== "score" || !TRI.desc) trier();
  appliquerFiltres();
}

function brancherValeurs(panneau) {
  for (const el of panneau.querySelectorAll("[data-f]")) {
    const v = FILTRES[el.dataset.f];
    if (el.type === "checkbox") el.checked = !!v;
    else if (el.dataset.f === "tri") el.value = v || "score|1";
    else if (el.dataset.f !== "raz") el.value = v || "";
  }
}

let LISTE = null, POSITION = 0, COURANTE = null;

function afficher() {
  const url = decodeURIComponent(location.hash.slice(1)) || "/";
  const app = document.getElementById("app");
  const page = PAGES[url] ? url : "/";
  if (COURANTE === "/" && LISTE) POSITION = window.scrollY;
  if (page === "/") {
    // la liste est construite une seule fois : elle garde ses filtres, son tri et sa position
    if (!LISTE) {
      LISTE = document.createElement("div");
      LISTE.innerHTML = PAGES["/"];
      app.replaceChildren(LISTE);
      brancherListe();
    } else {
      app.replaceChildren(LISTE);
    }
    window.scrollTo(0, POSITION);
  } else {
    app.innerHTML = PAGES[page];
    window.scrollTo(0, 0);
  }
  COURANTE = page;
}

document.addEventListener("click", e => {
  const t = e.target.closest("#app [data-tri]");
  if (!t) return;
  e.preventDefault(); e.stopPropagation();
  const cle = t.dataset.tri;   // 1er appui : du plus grand au plus petit pour score/m²/chambres, sinon croissant
  TRI = { cle, desc: TRI.cle === cle ? !TRI.desc : ["score", "surface", "chambres"].includes(cle) };
  trier();
}, true);

document.addEventListener("click", e => {
  const a = e.target.closest("a");
  const href = a && a.getAttribute("href");
  if (href && href.startsWith("/")) { e.preventDefault(); e.stopPropagation(); aller(href); }
}, true);

async function ouvrir(mdp, retenir) {
  PAGES = await dechiffrer(mdp);
  if (retenir) { try { localStorage.setItem("immo_mdp", mdp); } catch (e) {} }
  document.getElementById("verrou").hidden = true;
  document.getElementById("app").hidden = false;
  window.addEventListener("hashchange", afficher);
  afficher();
}

document.getElementById("form-mdp").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("erreur");
  err.textContent = "Ouverture…";
  try {
    await ouvrir(document.getElementById("mdp").value, document.getElementById("retenir").checked);
  } catch (x) {
    err.textContent = "Mot de passe incorrect.";
  }
});

(async () => {
  let mdp = null;
  try { mdp = localStorage.getItem("immo_mdp"); } catch (e) {}
  if (mdp) {
    try { await ouvrir(mdp, false); } catch (x) { try { localStorage.removeItem("immo_mdp"); } catch (e) {} }
  }
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
